name: cinetrekker_android
description: CineTrekker native Android app built with Flutter.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  app_links: ^6.4.1
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.1.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png
