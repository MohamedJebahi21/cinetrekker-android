name: cinetrekker_android
description: CineTrekker native Android app built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  app_links: ^6.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  go_router: ^16.1.0
  url_launcher: ^6.3.1
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1

dev_dependencies:
  build_runner: ^2.8.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/app_icon.png
