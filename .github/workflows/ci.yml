name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage
        env:
          # Prefer CINETREKKER_* secrets; fall back to legacy names during migration.
          CINETREKKER_SUPABASE_URL: ${{ secrets.CINETREKKER_SUPABASE_URL || secrets.SUPABASE_URL }}
          CINETREKKER_SUPABASE_ANON_KEY: ${{ secrets.CINETREKKER_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          CINETREKKER_API_BASE_URL: ${{ secrets.CINETREKKER_API_BASE_URL || secrets.API_BASE_URL }}
