name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/cinetrekker-upload-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../cinetrekker-upload-key.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve dart-defines
        id: defines
        env:
          CINETREKKER_SUPABASE_URL: ${{ secrets.CINETREKKER_SUPABASE_URL || secrets.SUPABASE_URL }}
          CINETREKKER_SUPABASE_ANON_KEY: ${{ secrets.CINETREKKER_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          CINETREKKER_API_BASE_URL: ${{ secrets.CINETREKKER_API_BASE_URL || secrets.API_BASE_URL }}
          CINETREKKER_SENTRY_DSN: ${{ secrets.CINETREKKER_SENTRY_DSN }}
        run: |
          if [ -z "$CINETREKKER_SUPABASE_URL" ] || [ -z "$CINETREKKER_SUPABASE_ANON_KEY" ] || [ -z "$CINETREKKER_API_BASE_URL" ]; then
            echo "Missing required CINETREKKER_* secrets (or legacy SUPABASE_*/API_BASE_URL fallbacks)."
            exit 1
          fi
          {
            echo "CINETREKKER_SUPABASE_URL=$CINETREKKER_SUPABASE_URL"
            echo "CINETREKKER_SUPABASE_ANON_KEY=$CINETREKKER_SUPABASE_ANON_KEY"
            echo "CINETREKKER_API_BASE_URL=$CINETREKKER_API_BASE_URL"
            echo "CINETREKKER_SENTRY_DSN=$CINETREKKER_SENTRY_DSN"
          } > dart_defines.env
          echo "defines_file=dart_defines.env" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=dart_defines.env

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=dart_defines.env

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: dart-debug-info-${{ github.ref_name }}
          path: build/debug-info
          if-no-files-found: warn

      - name: Rename artifacts
        run: |
          TAG=${{ github.ref_name }}
          cp build/app/outputs/flutter-apk/app-release.apk cinetrekker-${TAG}.apk
          cp build/app/outputs/bundle/release/app-release.aab cinetrekker-${TAG}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CineTrekker ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            cinetrekker-${{ github.ref_name }}.apk
            cinetrekker-${{ github.ref_name }}.aab
          body: |
            ## CineTrekker ${{ github.ref_name }}

            ### ⬇️ Download

            | File | Platform |
            |------|----------|
            | `cinetrekker-${{ github.ref_name }}.apk` | Android (sideload) |
            | `cinetrekker-${{ github.ref_name }}.aab` | Google Play Store |

            ### Installing the APK
            1. Download `cinetrekker-${{ github.ref_name }}.apk` to your Android device
            2. Enable **Install unknown apps** in your device settings
            3. Open the downloaded file and tap **Install**

            > Requires Android 7.0 (API 24)+
